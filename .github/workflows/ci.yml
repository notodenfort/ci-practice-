name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linter
        run: pip install ruff
      - name: Run lint
        run: |
          if [ -d "ci-practice" ]; then cd ci-practice; fi
          ruff check . --exit-zero

  unit:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: |
          if [ -d "ci-practice" ]; then cd ci-practice; fi
          pip install pytest pytest-split ruff
          pytest -m "not quarantine" --splits 4 --group ${{ matrix.shard }} --junitxml=report-${{ matrix.shard }}.xml
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report-${{ matrix.shard }}
          path: "**/report-${{ matrix.shard }}.xml"

  quarantine:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run quarantined tests
        run: |
          if [ -d "ci-practice" ]; then cd ci-practice; fi
          pip install pytest pytest-split
          pytest -m "quarantine" -v || true

  docker-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests in Docker
        run: |
          if [ -d "ci-practice" ]; then
            cp -r ci-practice/* . 2>/dev/null || true
          fi
          docker build -t ci-practice-tests .
          docker run --rm ci-practice-tests

  deploy-staging:
    needs: [unit, docker-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging
        run: echo "Деплой на staging выполнен (имитация)"
